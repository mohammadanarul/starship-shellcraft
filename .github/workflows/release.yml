name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"


  rpm:
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install -y \
            rpm-build \
            tar \
            gzip \
            git \
            coreutils

      - name: Build RPM
        run: |
          chmod +x packaging/rpm/build-rpm.sh
          ./packaging/rpm/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: "*.rpm"


  arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch build tools
        run: |
          pacman -Sy \
            --noconfirm \
            --needed \
            base-devel \
            git \
            fzf \
            bash-completion \
            curl

      - name: Build Arch package
        run: |
          chmod +x packaging/arch/build-pkg.sh
          ./packaging/arch/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: "*.pkg.tar.*"


  tarball:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build tarball
        run: |
          chmod +x packaging/tarball/build-tarball.sh
          ./packaging/tarball/build-tarball.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tar.gz"


  release:
    needs:
      - deb
      - rpm
      - arch
      - tarball

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true